name: Windows build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --locked --all-targets
      - name: Build release executable
        run: cargo build --locked --release --bin bibiiwiki
      - name: Package Windows release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Compress-Archive -LiteralPath @(
            'target/release/bibiiwiki.exe',
            'README.md',
            'LICENSE',
            'bibiiwiki.example.yaml'
          ) -DestinationPath 'dist/bibiiwiki-windows-x86_64.zip'
          $hash = (Get-FileHash 'dist/bibiiwiki-windows-x86_64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  bibiiwiki-windows-x86_64.zip" | Set-Content -Path 'dist/SHA256SUMS' -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: bibiiwiki-windows-x86_64
          path: dist/*
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: bibiiwiki-windows-x86_64
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/bibiiwiki-windows-x86_64.zip \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "BIBIIWIKI $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
